<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>青埔國中籃球照片</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: Arial, "Microsoft JhengHei", sans-serif;
}

.photo-container {
    width: 100%;
    overflow: hidden;
    padding: 10px 0;
}

.photo-track {
    display: flex;
    width: max-content;
    gap: 20px;
    animation: photo-scroll 35s linear infinite;
}

.photo-track:hover {
    animation-play-state: paused;
}

.photo-track img {
    width: 280px;
    height: 190px;
    object-fit: cover;
    border-radius: 12px;
    flex-shrink: 0;
    display: block;
}

/* 跑馬燈動畫 */
@keyframes photo-scroll {
    0% {
        transform: translateX(0);
    }

    100% {
        transform: translateX(-50%);
    }
}

/* 手機版 */
@media (max-width: 600px) {

    .photo-track img {
        width: 220px;
        height: 150px;
    }

    .photo-track {
        gap: 12px;
    }

}

</style>
</head>

<body>

<div class="photo-container">

<div class="photo-track">

<!-- 第一組：四張不同照片 -->

<img src="https://raw.githubusercontent.com/qpjhs/basketball-photos/main/6.jpg"&gt;

<img src="https://raw.githubusercontent.com/qpjhs/basketball-photos/main/DSC_1920.jpeg"&gt;

<img src="https://raw.githubusercontent.com/qpjhs/basketball-photos/main/DSC_1926.jpeg"&gt;

<img src="https://raw.githubusercontent.com/qpjhs/basketball-photos/main/DSC_2001.jpeg"&gt;


<!-- 第二組：複製照片，讓跑馬燈可以無縫循環 -->

<img src="https://raw.githubusercontent.com/qpjhs/basketball-photos/main/6.jpg"&gt;

<img src="https://raw.githubusercontent.com/qpjhs/basketball-photos/main/DSC_1920.jpeg"&gt;

<img src="https://raw.githubusercontent.com/qpjhs/basketball-photos/main/DSC_1926.jpeg"&gt;

<img src="https://raw.githubusercontent.com/qpjhs/basketball-photos/main/DSC_2001.jpeg"&gt;

</div>

</div>

</body>
</html>
