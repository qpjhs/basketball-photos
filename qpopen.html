<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>青埔國中籃球隊出席管理</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f9;color:#172033;font-family:system-ui,"Noto Sans TC",sans-serif}.wrap{max-width:720px;margin:auto;padding:16px}header{background:#173b63;color:white;padding:22px;border-radius:16px}h1{font-size:24px;margin:0 0 5px}header p{margin:0;color:#dce8f5}.card{background:white;padding:18px;border:1px solid #e1e7ef;border-radius:15px;margin:14px 0}h2{font-size:19px;margin:0 0 12px}label{display:block;margin:12px 0 5px;font-weight:650}input,select,button{font:inherit;padding:11px;border-radius:9px;border:1px solid #cbd5e1;width:100%}button{border:0;background:#173b63;color:white;font-weight:700;cursor:pointer}.secondary{background:#e8eef5;color:#173b63}.danger{background:#fbe7e7;color:#9b2525}.hidden{display:none!important}.row,.actions{display:flex;gap:9px}.row>* ,.actions>*{flex:1;min-width:0}.player,.record{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #edf0f4}.player small,.hint{display:block;color:#68778b;font-size:13px}.statuses{display:flex;gap:5px}.statuses button{width:auto;padding:9px 10px;background:#edf1f5;color:#334155;font-size:13px}.statuses .on[data-s="出席"]{background:#d8f2df;color:#176534;outline:2px solid #299653}.statuses .on[data-s="請假"]{background:#fff0c9;color:#805500;outline:2px solid #d49b22}.statuses .on[data-s="缺席"]{background:#fde0e0;color:#9b2222;outline:2px solid #d34b4b}.pills{display:flex;gap:8px;margin:12px 0}.pill{flex:1;text-align:center;background:#eef3f8;padding:10px 3px;border-radius:9px;font-weight:700}.msg{background:#edf5ff;padding:10px;border-radius:8px;margin-top:10px}.hint{margin-top:12px}@media(max-width:520px){.wrap{padding:11px}.player{align-items:flex-start;flex-direction:column}.statuses{width:100%}.statuses button{flex:1}.row,.actions{flex-direction:column}}
</style></head><body><main class="wrap">
<header><h1>青埔國中籃球隊</h1><p>出席管理與家長查詢｜單機試用版</p></header>
<section id="login" class="card"><h2>登入專區</h2><label>登入身分</label><select id="role"><option value="parent">家長查詢</option><option value="coach">教練管理</option></select><label>密碼</label><input id="pw" type="password" placeholder="請輸入密碼"><div class="actions" style="margin-top:12px"><button id="loginBtn">登入</button></div><div id="msg" class="msg hidden"></div><p class="hint">試用密碼：家長 2468、教練 1357。教練登入後可修改。</p></section>
<section id="app" class="hidden">
<div class="card"><div class="row"><h2 id="heading">出席紀錄</h2><button id="logout" class="secondary">登出</button></div><label>查詢日期</label><input id="date" type="date"><div id="stats" class="pills"></div><div id="list"></div><div id="coachActions" class="hidden"><div class="actions"><button id="all" class="secondary">全部設為出席</button><button id="save">儲存紀錄</button></div></div></div>
<div id="rosterCard" class="card hidden"><h2>球員名單管理</h2><p class="hint">新增球員；退出球員會保留舊紀錄。</p><div class="row"><div><label>背號</label><input id="number" placeholder="例如 12"></div><div><label>姓名</label><input id="name" placeholder="球員姓名"></div></div><div class="actions" style="margin-top:12px"><button id="add">新增球員</button></div><div id="roster"></div></div>
<div id="settings" class="card hidden"><h2>修改試用密碼</h2><div class="row"><div><label>家長密碼</label><input id="parentPw" type="password"></div><div><label>教練密碼</label><input id="coachPw" type="password"></div></div><div class="actions" style="margin-top:12px"><button id="pwSave">更新密碼</button></div></div>
</section><p class="hint" style="text-align:center">資料只保存在目前這個瀏覽器，不會自動同步到其他手機。</p></main>
<script>
const STORE='cp_attendance_standalone_v1',base={parentPw:'2468',coachPw:'1357',players:[],records:{}};
let db;try{db=Object.assign({},base,JSON.parse(localStorage.getItem(STORE)||'{}'))}catch(e){db={...base}}
let role='';
const $=id=>document.getElementById(id),today=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function persist(){localStorage.setItem(STORE,JSON.stringify(db))}
function active(){return db.players.filter(p=>p.active)}
function rec(){let d=$('date').value;db.records[d]??={};return db.records[d]}
function login(){let r=$('role').value,p=$('pw').value;if((r==='parent'&&p===db.parentPw)||(r==='coach'&&p===db.coachPw)){role=r;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('heading').textContent=r==='coach'?'教練出席管理':'家長出席查詢';$('coachActions').classList.toggle('hidden',r!=='coach');$('rosterCard').classList.toggle('hidden',r!=='coach');$('settings').classList.toggle('hidden',r!=='coach');$('date').value=today();render()}else{$('msg').textContent='密碼錯誤，請再試一次';$('msg').classList.remove('hidden')}}
function logout(){role='';$('app').classList.add('hidden');$('login').classList.remove('hidden');$('pw').value=''}
function render(){let r=rec(),list=$('list');list.innerHTML='';let ps=role==='coach'?active():active().filter(p=>r[p.id]);if(role==='parent'&&!ps.length)list.textContent='這一天尚無出席紀錄。';ps.forEach(p=>{let d=document.createElement('div');d.className='player';let name=document.createElement('div');name.innerHTML='<b>'+esc(p.number)+' 號　'+esc(p.name)+'</b><small>'+(role==='coach'?'選擇出席狀況':'出席狀況')+'</small>';d.append(name);if(role==='coach'){let group=document.createElement('div');group.className='statuses';['出席','請假','缺席'].forEach(s=>{let b=document.createElement('button');b.textContent=s;b.dataset.s=s;b.classList.toggle('on',r[p.id]===s);b.onclick=()=>{r[p.id]=s;render()};group.append(b)});d.append(group)}else{let b=document.createElement('b');b.textContent=r[p.id];d.append(b)}list.append(d)});
$('stats').innerHTML=['出席','請假','缺席'].map(s=>'<div class="pill">'+s+'<br>'+Object.values(r).filter(x=>x===s).length+'</div>').join('');if(role==='coach')renderRoster()}
function renderRoster(){$('roster').innerHTML='';db.players.forEach(p=>{let d=document.createElement('div');d.className='record';let t=document.createElement('span');t.textContent=p.number+' 號　'+p.name+(p.active?'':'（已退出）');let b=document.createElement('button');b.className=p.active?'danger':'secondary';b.style.maxWidth='110px';b.textContent=p.active?'設為退出':'重新加入';b.onclick=()=>{p.active=!p.active;persist();render()};d.append(t,b);$('roster').append(d)})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('loginBtn').onclick=login;$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('logout').onclick=logout;$('date').onchange=render;
$('all').onclick=()=>{active().forEach(p=>rec()[p.id]='出席');render()};
$('save').onclick=()=>{let missing=active().filter(p=>!rec()[p.id]);if(missing.length){alert('還有 '+missing.length+' 位球員未登記，請先完成或保留未登記。');return}persist();alert('已儲存本機出席紀錄。')};
$('add').onclick=()=>{let n=$('number').value.trim(),name=$('name').value.trim();if(!n||!name){alert('請輸入背號與姓名');return}db.players.push({id:'p'+Date.now()+Math.random().toString(16).slice(2),number:n,name,active:true});$('number').value='';$('name').value='';persist();render()};
$('pwSave').onclick=()=>{let p=$('parentPw').value,c=$('coachPw').value;if(p.length<4||c.length<4){alert('兩組密碼至少需要 4 個字元');return}db.parentPw=p;db.coachPw=c;persist();alert('密碼已更新（僅此瀏覽器有效）')};
</script></body></html>
