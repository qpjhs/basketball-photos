<style>
.marquee-box {
  width: 100%;
  overflow: hidden;
  background: #111;
  padding: 10px 0;
}

.marquee-track {
  display: flex;
  width: max-content;
  animation: scroll 25s linear infinite;
}

.marquee-track:hover {
  animation-play-state: paused;
}

.marquee-track a {
  display: block;
  margin-right: 15px;
  flex-shrink: 0;
}

.marquee-track img {
  width: 260px;
  height: 160px;
  object-fit: cover;
  border-radius: 8px;
}

@keyframes scroll {
  from {
    transform: translateX(0);
  }
  to {
    transform: translateX(-50%);
  }
}
</style>
